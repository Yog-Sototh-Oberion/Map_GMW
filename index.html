<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Великий Шёлковый путь в Казахстане</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Cormorant Garamond",serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;
 background:url(https://assets.codepen.io/252820/parchment-2.jpg?width=2337&height=1917&format=auto) no-repeat center center fixed;background-size:cover;overflow-x:hidden;padding:20px;box-sizing:border-box}
h1{font-family:"Cormorant Garamond",serif;font-weight:700;color:#5c3d21;text-align:center;font-size:2rem;text-shadow:1px 1px 2px rgba(0,0,0,.2);position:absolute;top:0}
#slider-container{width:80%;max-width:1100px;height:80vh;max-height:640px;position:relative;border:2px solid #b8d8df;box-shadow:0 0 20px rgba(0,0,0,.2);background:#fdf3d7;z-index:2;margin:3rem auto}
#map{position:absolute;width:100%;height:100%;z-index:0}
.slide{position:absolute;top:0;left:0;z-index:1000;width:100%;height:100%;padding:2rem;background:rgba(253,243,215,.15);opacity:0;pointer-events:none;
 transition:opacity .8s ease,transform .8s cubic-bezier(.6,.2,.3,1);transform:translateY(40px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;box-sizing:border-box}
.slide.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.slide-content{width:36%;min-width:260px;background:rgba(253,243,215,.92);padding:1.6rem 2rem;border-radius:8px;box-shadow:2px 4px 10px rgba(0,0,0,.25);background-image:url(https://assets.codepen.io/252820/soft-wallpaper.png)}
.slide h3{color:#a05d34;margin:0 0 .3em;font-size:1.25rem;font-weight:700;letter-spacing:.04em}
.slide p{font-size:1.05rem;line-height:1.35;color:#3a2e1a;margin:0 0 .8em}
.slide img{width:100%;max-width:500px;max-height:170px;object-fit:cover;margin-top:.6rem;border:1px solid #d1a878;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:block}
.slide .cap{font-size:.8rem;color:#7a6143;margin:.2rem 0 0;font-style:italic}
#ov{position:absolute;inset:0;width:100%;height:100%;z-index:500;pointer-events:none}
.ovl{font:700 14px "Cormorant Garamond",serif;fill:#5c3d21;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3px}
.compass-tip{font-family:"Cormorant Garamond",serif;font-weight:600;position:absolute;display:flex;right:-120px;bottom:-85px;width:150px;flex-direction:row-reverse;font-size:13px;gap:5px;transition:opacity .5s ease;z-index:1001;color:#5c3d21}
.compass-tip.hidden{opacity:0;pointer-events:none}
.compass-tip svg{transform:scaleX(-1) rotate(120deg);flex:none}
.compass-container{position:absolute;bottom:-30px;right:-30px;width:150px;height:150px;pointer-events:none;z-index:1000}
.compass{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 20px rgba(0,0,0,.2);position:relative;pointer-events:auto;border:2px solid #a05d34}
.compass-face{position:absolute;inset:0;border-radius:50%;background:rgba(253,243,215,.9) url(https://assets.codepen.io/252820/soft-wallpaper.png);display:flex;justify-content:center;align-items:center;overflow:hidden}
.compass-rose{position:absolute;width:90%;height:90%;border-radius:50%;border:1px solid #a05d34}
.direction{position:absolute;font-weight:700;font-size:18px;color:#a05d34;text-align:center;width:30px;height:30px;line-height:30px;cursor:pointer;pointer-events:auto}
.north{top:5px;left:50%;transform:translateX(-50%)}
.east{right:5px;top:50%;transform:translateY(-50%);z-index:3}
.south{bottom:5px;left:50%;transform:translateX(-50%)}
.west{left:5px;top:50%;transform:translateY(-50%);z-index:3}
.east:hover,.west:hover{color:#d1a878}
.navigation-label{position:absolute;top:35px;color:#5c3d21;font-size:12px;font-weight:600;background:rgba(253,243,215,.3);padding:4px 10px;border-radius:10px;box-shadow:2px 2px 5px 0 rgba(0,0,0,.1) inset}
.needle{position:absolute;top:50%;left:50%;width:4px;height:70px;background:linear-gradient(to bottom,#a05d34 0%,#a05d34 50%,#d1a878 50%,#d1a878 100%);transform:translate(-50%,-50%);z-index:10}
.center-pin{position:absolute;top:50%;left:50%;width:12px;height:12px;background:#a05d34;border-radius:50%;transform:translate(-50%,-50%);z-index:11;border:2px solid #d1a878}
.outer-ring,.inner-ring{position:absolute;border-radius:50%;border:1px solid #a05d34}
.outer-ring{width:96%;height:96%;top:2%;left:2%}
.inner-ring{width:70%;height:70%;top:15%;left:15%;border-style:dashed}
.hint{position:absolute;left:12px;bottom:10px;z-index:1000;font-size:13px;color:#5c3d21;background:rgba(253,243,215,.8);padding:2px 8px;border-radius:6px}
.deco{position:fixed;z-index:1;width:min(22vw,320px);height:auto;border:7px solid #fdf3d7;border-radius:3px;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none}
.deco.tl{top:1.2rem;left:1.2rem;transform:rotate(-4deg)}
.deco.tr{top:1.2rem;right:1.2rem;transform:rotate(5deg)}
.deco.bl{bottom:1.2rem;left:1.2rem;transform:rotate(-3deg)}
.deco.br{bottom:1rem;right:1.2rem;width:min(18vw,260px);border:0;box-shadow:none;mix-blend-mode:multiply;transform:rotate(4deg)}
@media(max-width:1250px){.deco{display:none}}
@media(max-width:900px){.slide-content{width:60%}h1{font-size:1.4rem}}
</style>
</head>
<body>
<h1>Великий Шёлковый путь в Казахстане</h1>
<div id="slider-container">
 <div id="map"></div>
 <svg id="ov"></svg>
 <div id="slides"></div>
 <div class="hint">A / D или ← → — листать</div>
 <div class="compass-container" id="compass-container">
  <div class="compass"><div class="compass-face">
   <div class="compass-rose"></div>
   <div class="direction north">С</div><div class="direction east" id="east">В</div>
   <div class="direction south">Ю</div><div class="direction west" id="west">З</div>
   <div class="navigation-label"><span id="journey-progress">1</span> из <span id="journey-total">7</span></div>
   <div class="outer-ring"></div><div class="inner-ring"></div>
   <div class="needle" id="needle"></div><div class="center-pin"></div>
  </div></div>
 </div>
 <div class="compass-tip" id="compass-tip">
  <p>Нажимай на «З» и «В», чтобы листать</p>

 </div>
</div>

[0,1,2,3].forEach(i=>waypoints[i].photo=IMG[i]); waypoints[6].photo=IMG[4];
const route = [[44.2,80.4],[43.3,77.24],[42.9,71.37],[42.3,69.77],[42.85,68.3],[43.3,68.25],[44.8,65.5],[45.8,62],[47,57.5],[47.2,54.5],[47.5,51.7]];

const map = L.map("map",{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,attributionControl:false});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
// Линии и точки рисуем сами поверх карты и пересчитываем на каждом кадре анимации,
// поэтому они не пропадают и не отрываются от карты во время полёта.
const box=document.getElementById("slider-container"), ov=document.getElementById("ov");
const branch=[[42.3,69.77],[39.65,66.96]];
const pt=ll=>map.latLngToContainerPoint(ll);
const D=a=>a.map((p,i)=>{const q=pt(p);return (i?"L":"M")+q.x.toFixed(1)+" "+q.y.toFixed(1)}).join("");
function draw(){
 let h=`<path d="${D(route)}" fill="none" stroke="#a05d34" stroke-width="4" stroke-opacity=".75" stroke-dasharray="8 6" stroke-linecap="round"/>`+
  `<path d="${D(branch)}" fill="none" stroke="#a05d34" stroke-width="3" stroke-opacity=".5" stroke-dasharray="4 8" stroke-linecap="round"/>`;
 const sp=pt(branch[1]); h+=`<text class="ovl" x="${sp.x+8}" y="${sp.y+4}">Самарканд, Бухара</text>`;
 waypoints.forEach((w,i)=>{ if(w.marker===false) return;
  const p=pt([w.location.lat,w.location.lng]), on=i===current;
  h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${on?10:7}" fill="${on?"#a05d34":"#d1a878"}" stroke="#a05d34" stroke-width="2"/>`+
     `<text class="ovl" x="${p.x.toFixed(1)}" y="${(p.y-15).toFixed(1)}" text-anchor="middle">${w.title.split(" (")[0]}</text>`;
 });
 ov.innerHTML=h;
}
let _q=0; const redraw=()=>{ if(!_q) _q=requestAnimationFrame(()=>{_q=0;draw()}) };
map.on("move zoom moveend zoomend resize",redraw);

function setView(lat,lng,zoom,animate){
 const shift = window.innerWidth>900 ? box.clientWidth*0.17 : 0;      // сдвиг, чтобы карточка не закрывала город
 const c = map.unproject(map.project([lat,lng],zoom).subtract([shift,0]),zoom);
 animate ? map.flyTo(c,zoom,{duration:1.6,easeLinearity:.25}) : map.setView(c,zoom);
}

const slidesContainer=document.getElementById("slides");
waypoints.forEach((p,i)=>{
 const s=document.createElement("div"); s.className="slide"+(i===0?" active":"");
 s.innerHTML=`<div class="slide-content"><h3>${p.title}</h3><p><i>${p.year}</i></p><p>${p.description}</p>${p.photo?`<img src="${p.photo}" alt="${p.title}">`:`<img hidden alt="${p.title}"><div class="cap" hidden></div>`}</div>`;
 slidesContainer.appendChild(s);
});

let current=0;
const slides=document.querySelectorAll(".slide");
const progress=document.getElementById("journey-progress");
document.getElementById("journey-total").textContent=waypoints.length;
function showSlide(i){
 slides.forEach((s,k)=>{ if(k===i){s.classList.remove("active");void s.offsetWidth;s.classList.add("active")}else s.classList.remove("active") });
 const w=waypoints[i]; setView(w.location.lat,w.location.lng,w.zoom,true);
 progress.textContent=i+1;
}
const tip=document.getElementById("compass-tip");
const prev=()=>{ if(current>0){current--;showSlide(current);tip.classList.add("hidden")} };
const next=()=>{ if(current<waypoints.length-1){current++;showSlide(current);tip.classList.add("hidden")} };
document.getElementById("west").addEventListener("click",prev);
document.getElementById("east").addEventListener("click",next);
document.addEventListener("keydown",e=>{
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
 if(e.code==="ArrowLeft"||e.code==="KeyA") prev();
 if(e.code==="ArrowRight"||e.code==="KeyD") next();
});

// фото городов: подтягиваем из Википедии (нужен интернет), карты и гербы пропускаем
const wiki={4:"Otrar ancient city Kazakhstan"};
const capt={4:"Развалины Отрара"};
Object.entries(wiki).forEach(([i,q])=>{
 fetch("https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&prop=pageimages&piprop=thumbnail&pithumbsize=600&gsrsearch="+encodeURIComponent(q))
 .then(r=>r.json()).then(d=>{
  const pg=Object.values((d.query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  const hit=pg.find(p=>p.thumbnail&&!/map|flag|coat|locator|location|emblem|seal|logo|blank/i.test(p.thumbnail.source));
  if(!hit) return;
  const sl=slides[i], im=sl.querySelector("img"), cp=sl.querySelector(".cap");
  im.src=hit.thumbnail.source; im.hidden=false; cp.textContent=capt[i]; cp.hidden=false;
 }).catch(()=>{});
});

setView(waypoints[0].location.lat,waypoints[0].location.lng,waypoints[0].zoom,false);

// стрелка компаса следит за мышью (из исходного кода)
const cc=document.getElementById("compass-container"), needle=document.getElementById("needle");
let prevA=0, rot=0;
document.addEventListener("mousemove",e=>{
 const r=cc.getBoundingClientRect();
 let a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
 if(prevA>150&&a<-150)rot++; else if(prevA<-150&&a>150)rot--;
 prevA=a; a+=rot*360;
 needle.style.transition="transform .1s ease";
 needle.style.transform=`translate(-50%,-50%) rotate(${a+90}deg)`;
});
</script>
